[package]
name = "ward"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "GPL-3.0-or-later"
default-run = "ward"

[features]
default = ["gui"]
gui = ["dep:gtk", "dep:adw"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"], optional = true }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"], optional = true }
gio = "0.22"
glib = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "ward"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "ward-helper"
path = "src/bin/ward-helper.rs"
